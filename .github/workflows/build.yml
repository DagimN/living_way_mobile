name: Flutter Android CI/CD

on:
  push:
    branches:
      - dev
      - main

jobs:
  # ==========================================
  # JOB 1: STAGING BUILD (Triggered on dev)
  # ==========================================
  build-staging:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decode .env File
        run: |
          echo "${{ secrets.ENV_BASE64 }}" | base64 -d > .env

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Staging APK
        run: flutter build apk --flavor staging --target lib/main.dart --split-per-abi --debug

      - name: Upload Staging APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          # Extract version line (e.g., "1.0.0+12")
          FULL_VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')

          # Clean version (without build number, e.g., "1.0.0")
          VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)

          # Export variables to step output
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          tag: "v${{ steps.get_version.outputs.version_name }}-${{ github.run_number }}"
          name: "Release v${{ steps.get_version.outputs.version_name }} (Build ${{ github.run_number }})"
          body: "Automated production build for version ${{ steps.get_version.outputs.full_version }}."
          token: ${{ secrets.GH_TOKEN }}

  # ==========================================
  # JOB 2: PRODUCTION BUILD (Triggered on main)
  # ==========================================
  build-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decode .env File
        run: |
          echo "${{ secrets.ENV_BASE64 }}" | base64 -d > .env

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build Production APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --flavor prod --target lib/main.dart --split-per-abi --release

      - name: Build Play Store App Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --flavor prod --target lib/main.dart --release

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Play Store App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-aab-${{ github.sha }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          # Extract version line (e.g., "1.0.0+12")
          FULL_VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')

          # Clean version (without build number, e.g., "1.0.0")
          VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)

          # Export variables to step output
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk,build/app/outputs/bundle/prodRelease/app-prod-release.aab"
          tag: "v${{ steps.get_version.outputs.version_name }}-${{ github.run_number }}"
          name: "Release v${{ steps.get_version.outputs.version_name }} (Build ${{ github.run_number }})"
          body: "Automated production build for version ${{ steps.get_version.outputs.full_version }}."
          token: ${{ secrets.GH_TOKEN }}
